server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # the React app (single page: unknown paths fall back to index.html)
  location / {
    try_files $uri /index.html;
  }

  # /api/foo  ->  backend:8000/foo   (the same rewrite the Vite dev server does).
  # Docker's DNS (127.0.0.11) is asked again every few seconds, so recreating the backend container never leaves nginx pointing
  # at a stale address (that would show as HTTP 502).
  location /api/ {
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_read_timeout 240s;                 # an LLM call can take a while (LLM_TIMEOUT in .env)
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
